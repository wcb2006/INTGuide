services:
  db:
    image: postgres:17
    container_name: intguide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intguide
    ports:
      - "5433:5432"
    volumes:
      - intguide-data:/var/lib/postgresql/data

volumes:
  intguide-data:
